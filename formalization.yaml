fidelity:
  divergences: >-
    (1) Plane graphs are rotation systems of connected simple graphs satisfying
    Euler's formula |V| + |F| = |E| + 2, not drawings; that these are exactly
    the plane embeddings is classical and not formalized. In particular the
    statements about plane graphs are about connected graphs with at least one
    edge: faces are cycles of darts, so the one-vertex graph has no faces and is
    not plane here. The theorems of Lipton, Rose and Tarjan hold for all planar
    graphs; the disconnected case, which follows by joining the components with
    extra edges (a separation of the larger graph is one of the original), is
    not formalized. (2) The separator constant is 6 and the separator-tree
    constants are 50000 and 40 (1062 (D + 1)^2 + 1) for squares of graphs of
    maximum degree D; they are not optimized. (3) Operation counts are in the
    arithmetic model: the algorithms are written in a writer monad and the count
    is the number of ring operations performed through its charged primitives
    (an inversion counts as one multiplication; data movement is free); the
    statements are about the explicit algorithm NestedDissection.sparseCounted,
    whose definition is part of the statement. (4) The elimination is written in
    place (NestedDissection.stage) with Lean's field inverse, which is totalized
    by 0^(-1) = 0. When all pivots met are nonzero (for instance when all
    leading principal minors are nonzero, in particular for positive definite
    matrices), it is Gaussian elimination without pivoting; at a zero pivot,
    where elimination without pivoting is undefined (for example the first pivot
    of [[0, 1], [1, 0]]), the totalized step leaves the matrix unchanged. The
    elimination statements hold for every matrix over a field with the given
    pattern in this totalized sense. (5) The filled graph is given to the
    algorithm as a hypothesis H = fill ...; computing it is not charged. (6) The
    machine statement is about one explicit machine (unit cost per instruction,
    natural words bounded by W along the run) and a fixed input encoding; the
    program is existentially quantified. The separator program requires the
    darts to be numbered so that the darts leaving lower vertices come first.

