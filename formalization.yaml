      module: "PlanarSeparatorSolution"
      status: proved
    - source: "Lipton-Rose-Tarjan 1979: separator trees with boundary bounds for planar graphs"
      lean: "PlanarSeparator.sepTree_exists"
      module: "PlanarSeparatorSolution"
      status: proved
    - source: "Separator trees for squares of planar graphs of bounded degree (derived here from Lipton-Tarjan 1979)"
