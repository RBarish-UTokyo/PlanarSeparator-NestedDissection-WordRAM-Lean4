      module: "PlanarSeparatorSolution"
      status: proved
    - source: "Lipton-Rose-Tarjan 1979: O(n log n) fill of nested dissection"
      lean: "PlanarSeparator.fill_bound"
      module: "PlanarSeparatorSolution"
      status: proved
    - source: "Lipton-Rose-Tarjan 1979: nested dissection of planar graphs in O(n^(3/2)) operations"
      lean: "PlanarSeparator.planar_nested_dissection"
      module: "PlanarSeparatorSolution"
      status: proved
    - source: "Nested dissection for squares of planar graphs of bounded degree in O(n^(3/2)) operations (Lipton-Rose-Tarjan 1979 applied to the derived separators)"
      lean: "PlanarSeparator.square_nested_dissection"
